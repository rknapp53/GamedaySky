<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gameday Sky: stadium forecasts</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏟️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
:root{
  --bg:#F3F5F9; --bg-2:#E8ECF2; --surface:#FFFFFF; --surface-2:#F1F4F9;
  --border:rgba(16,24,40,.08); --border-2:rgba(16,24,40,.18);
  --text:#121826; --mute:#566072; --faint:#7F8898;
  --wind:#0A7CC4; --temp:#C96F00; --feels:#DC3F44; --rain:#4F5FE8; --warn:#D1293D;
  --glass:rgba(255,255,255,.88);
  --shadow:0 1px 2px rgba(16,24,40,.04),0 10px 28px -14px rgba(16,24,40,.14);
  --font:'Geist','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;color:var(--text);font:15px/1.55 var(--font);font-feature-settings:"tnum" 1,"ss01" 1;
  -webkit-font-smoothing:antialiased;
  background:radial-gradient(1100px 520px at 85% -8%,rgba(10,124,196,.07),transparent 62%),var(--bg);background-attachment:fixed}
a{color:inherit}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--wind);outline-offset:2px;border-radius:8px}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
img{max-width:100%}

/* ---------- top ---------- */
header.top{padding:40px 0 4px}
.brand{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 32px;flex-wrap:wrap}
.brand h1{font-weight:600;font-size:clamp(2rem,4.6vw,3rem);line-height:1;letter-spacing:-.035em;margin:0}
.brand p{margin:0;color:var(--mute);max-width:44ch;font-size:.95rem}
.controls{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:32px 0 18px}
.chips{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--surface);border:1px solid var(--border)}
.chip{border:0;background:transparent;padding:7px 16px;border-radius:999px;font-weight:500;font-size:.88rem;color:var(--mute);transition:background .15s,color .15s}
.chip:hover{color:var(--text)}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.search{flex:1 1 240px;max-width:360px;margin-left:auto;background:var(--surface);border:1px solid var(--border);border-radius:999px;padding:9px 18px;transition:border-color .15s}
.search:focus{border-color:var(--border-2);outline:none}
.search::placeholder{color:var(--faint)}
.days{display:flex;gap:6px;overflow-x:auto;padding:2px 0 22px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:78px;border:1px solid var(--border);background:var(--surface);padding:10px 14px;border-radius:14px;text-align:left;color:var(--mute);transition:border-color .15s,background .15s}
.day:hover{border-color:var(--border-2)}
.day span{display:block;font-size:.75rem}
.day b{display:block;font-weight:600;font-size:1.05rem;color:var(--text);letter-spacing:-.01em}
.day[aria-current="true"]{background:var(--text);border-color:var(--text);color:rgba(255,255,255,.7)}
.day[aria-current="true"] b{color:var(--bg)}

/* ---------- list ---------- */
.note{color:var(--faint);font-size:.82rem;margin:0 0 14px}
.slot{margin:0 0 18px;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.slot h2{font-weight:600;font-size:.82rem;letter-spacing:.01em;color:var(--mute);margin:0;padding:12px 18px;border-bottom:1px solid var(--border)}
.game{display:grid;grid-template-columns:56px minmax(0,1.3fr) minmax(0,1fr) auto;gap:16px;align-items:center;width:100%;text-align:left;
  background:transparent;border:0;border-bottom:1px solid var(--border);padding:14px 18px;transition:background .15s}
.game:last-child{border-bottom:0}
.game:hover{background:var(--surface-2)}
.lg{font-size:.72rem;font-weight:600;color:var(--faint);letter-spacing:.04em}
.teams{display:flex;flex-direction:column;gap:6px;min-width:0}
.tm{display:flex;align-items:center;gap:10px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tm img{width:22px;height:22px;object-fit:contain;flex:none}
.tm .rk{color:var(--faint);font-size:.78rem}
.ven{color:var(--mute);font-size:.85rem;min-width:0}
.ven b{display:block;color:var(--text);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tags{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.tag{font-size:.72rem;font-weight:500;padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--mute);white-space:nowrap}
.tag.live{background:var(--warn);border-color:var(--warn);color:#fff}
.tag.roof{color:var(--wind);border-color:rgba(10,124,196,.3);background:rgba(10,124,196,.05)}
.empty{padding:48px 0;color:var(--mute);max-width:48ch}
@media (max-width:720px){
  .wrap{padding:0 16px}
  .search{margin-left:0;max-width:none}
  .game{grid-template-columns:44px minmax(0,1fr);gap:10px 12px}
  .ven,.tags{grid-column:2}
  .tags{justify-content:flex-start}
}

/* ---------- detail ---------- */
.back{background:var(--surface);border:1px solid var(--border);border-radius:999px;color:var(--mute);padding:7px 16px;margin:28px 0 20px;font-size:.88rem;font-weight:500}
.back:hover{color:var(--text);border-color:var(--border-2)}
.hero{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;margin:0 0 8px}
.hero .side{display:flex;align-items:center;gap:14px}
.hero img{width:clamp(38px,6vw,56px);height:clamp(38px,6vw,56px);object-fit:contain}
.hero h1{font-weight:600;font-size:clamp(1.9rem,5vw,3.2rem);line-height:1;letter-spacing:-.04em;margin:0}
.hero .at{font-weight:400;font-size:1.1rem;color:var(--faint)}
.meta{color:var(--mute);margin:0 0 24px;display:flex;flex-wrap:wrap;gap:4px 22px;font-size:.92rem}
.meta strong{color:var(--text);font-weight:500}
.status{color:var(--mute);padding:32px 0}
.status.err{color:var(--text);background:var(--surface);border:1px solid var(--border);padding:14px 18px;border-radius:14px;margin:0 0 14px}
.alert{background:#FEF3F2;border:1px solid #FECDCA;padding:12px 16px;border-radius:14px;margin:0 0 10px}
.alert b{display:block;color:#B42318;font-weight:600}
.roofnote{background:rgba(10,124,196,.06);border:1px solid rgba(10,124,196,.2);padding:12px 16px;border-radius:14px;margin:0 0 14px}

.mapwrap{position:relative;border-radius:24px;overflow:hidden;background:var(--bg-2);border:1px solid var(--border);
  box-shadow:0 24px 50px -26px rgba(16,24,40,.35)}
#map{height:clamp(420px,68vh,680px);width:100%}
.stage{position:relative;display:flex;flex-direction:column}

.windcanvas{position:absolute;inset:0;pointer-events:none}
.glass{background:var(--glass);border:1px solid var(--border-2);color:var(--text);box-shadow:0 4px 16px -6px rgba(16,24,40,.25);-webkit-backdrop-filter:blur(16px) saturate(140%);backdrop-filter:blur(16px) saturate(140%)}
.compass{position:absolute;left:16px;top:16px;width:84px;height:84px;pointer-events:none;border-radius:50%}
.windbadge{position:absolute;left:16px;bottom:16px;max-width:min(420px,calc(100% - 32px));pointer-events:none;border-radius:16px;padding:12px 16px}
.windbadge b{font-weight:600;font-size:1.05rem;color:var(--wind);letter-spacing:-.01em}
.windbadge div{font-size:.86rem;color:var(--text);opacity:.9}
.mapbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px 0 0}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:7px 16px;font-size:.85rem;font-weight:500;color:var(--mute);transition:all .15s}
.btn:hover{color:var(--text);border-color:var(--border-2)}
.btn[aria-pressed="true"]{background:var(--surface-2);color:var(--text);border-color:var(--border-2)}
.scrub{display:flex;gap:6px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none}
.scrub::-webkit-scrollbar{display:none}
.hr{flex:0 0 auto;min-width:76px;border:1px solid var(--border);background:var(--surface);border-radius:14px;padding:8px 10px;text-align:center;line-height:1.2;transition:all .15s}
.hr:hover{border-color:var(--border-2)}
.hr small{display:block;color:var(--faint);font-size:.7rem}
.hr b{font-weight:600;font-size:.98rem}
.hr.kick{border-color:rgba(10,124,196,.55)}
.hr[aria-pressed="true"]{background:var(--text);color:var(--bg);border-color:var(--text)}
.hr[aria-pressed="true"] small{color:rgba(255,255,255,.7)}

/* ---------- at-a-glance card (the key numbers) ---------- */
.glance{background:var(--surface);border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow);padding:22px 24px 16px;margin:0 0 18px}
.g-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.g-when{font-size:.85rem;font-weight:500;color:var(--mute)}
.g-verdict{margin:2px 0 0;font-size:clamp(1.15rem,2.4vw,1.45rem);font-weight:600;letter-spacing:-.02em}
.g-grid{display:grid;grid-template-columns:1.25fr 1.35fr 1fr 1fr;gap:0;border-top:1px solid var(--border)}
.g-cell{padding:16px 18px 14px;border-left:1px solid var(--border);min-width:0}
.g-cell:first-child{border-left:0;padding-left:0}
.g-lbl{display:block;font-size:.76rem;font-weight:500;color:var(--faint);margin-bottom:4px}
.g-big{font-weight:300;font-size:clamp(3.2rem,6vw,4.4rem);line-height:.95;letter-spacing:-.06em}
.g-mid{font-weight:500;font-size:clamp(1.8rem,3.4vw,2.3rem);line-height:1;letter-spacing:-.04em}
.g-mid small{font-size:.9rem;font-weight:500;letter-spacing:0;color:var(--mute);margin-left:4px}
.g-sub{display:block;margin-top:6px;font-size:.88rem;color:var(--mute)}
.g-sub b{color:var(--text);font-weight:500}
.g-wind .g-mid{color:var(--wind)}
.g-rain .g-mid{color:var(--rain)}
.g-rain.hi .g-mid{color:var(--warn)}
.g-temp .g-big{color:var(--text)}
.g-list{margin:0;display:grid;gap:8px}
.g-list div{display:flex;justify-content:space-between;gap:10px;font-size:.9rem}
.g-list dt{color:var(--mute)} .g-list dd{margin:0;font-weight:600}
.glance .scrub{border-top:1px solid var(--border);margin-top:4px;padding-top:14px}
@media (max-width:900px){
  .g-grid{grid-template-columns:1fr 1fr}
  .g-cell{border-left:0;padding:14px 0;border-top:1px solid var(--border)}
  .g-cell:nth-child(1),.g-cell:nth-child(2){border-top:0}
  .g-cell:nth-child(even){padding-left:16px;border-left:1px solid var(--border)}
}
@media (max-width:640px){
  .glance{padding:18px 16px 12px;border-radius:20px}
  .g-temp{grid-column:1/-1;display:flex;align-items:flex-end;gap:14px;border-bottom:1px solid var(--border)}
  .g-temp .g-lbl{display:none}
  .g-temp .g-sub{margin:0 0 6px}
  .g-grid .g-cell:nth-child(2){padding-left:0;border-left:0}
  .g-grid .g-cell:nth-child(3){padding-left:16px;border-left:1px solid var(--border);border-top:0}
  .g-grid .g-cell:nth-child(4){grid-column:1/-1;padding-left:0;border-left:0}
  .g-list{grid-template-columns:repeat(3,1fr);gap:6px 12px}
  .g-list div{display:block}
  .g-list dt{font-size:.76rem;color:var(--faint)}
}
/* ---------- phones ---------- */
button,.game,.hr,.chip,.day{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.search{font-size:16px} /* stops iOS zooming into the field */
.hero h1,.alm-head h3,.ven b{overflow-wrap:anywhere}
@media (hover:none){
  .game:hover,.btn:hover,.hr:hover,.day:hover{background:inherit}
  .game:active{background:var(--surface-2)}
}
@media (pointer:coarse){
  .chip{padding:10px 16px}
  .btn{padding:10px 16px}
  .hr{padding:10px 10px}
}
@media (max-width:640px){
  .wrap{padding:0 14px}
  header.top{padding-top:24px}
  .controls{margin:22px 0 14px}
  .chips{width:100%;justify-content:space-between}
  .chip{flex:1}
  #map{height:clamp(320px,56vh,460px);height:clamp(320px,56svh,460px)}
  .mapwrap{border-radius:18px}
  .compass{width:64px;height:64px;left:10px;top:10px}
  .windbadge{top:10px;bottom:auto;left:82px;right:10px;max-width:none;padding:9px 12px;border-radius:14px}
  .windbadge b{font-size:.95rem}
  .windbadge div{font-size:.8rem;line-height:1.35}
  .mapbar{gap:6px}.mapbar .btn{flex:1}
  section.blk{margin-top:36px}
  .chart{padding:10px 6px;box-shadow:var(--shadow)}
  .tablewrap{border-radius:16px}
  th,td{padding:10px 10px}
  th:first-child,td:first-child{position:sticky;left:0;background:#FFFFFF;z-index:1}
  td:nth-child(2){max-width:130px;overflow:hidden;text-overflow:ellipsis}
  tbody tr.sel td:first-child{background:#EEF3F9}
  .tablewrap{-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .nwstext{padding:16px 18px;box-shadow:var(--shadow)}
}

section.blk{margin:48px 0 0}
section.blk>h2{font-weight:600;font-size:1.45rem;letter-spacing:-.03em;margin:0 0 16px}
.trends{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.trends li{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:16px 18px;color:var(--mute);font-size:.9rem;position:relative;box-shadow:var(--shadow)}
.trends li b{display:block;font-weight:600;font-size:1rem;color:var(--text);margin-bottom:4px;letter-spacing:-.01em}
.trends li::before{content:"";position:absolute;top:18px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--faint)}
.trends li.hot::before{background:var(--temp)} .trends li.wet::before{background:var(--rain)} .trends li.windy::before{background:var(--wind)}
.chart{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:16px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--mute);font-size:.8rem;padding:8px 6px 0}
.legend i{display:inline-block;width:16px;height:3px;vertical-align:middle;margin-right:6px;border-radius:2px}
.tablewrap{overflow-x:auto;margin-top:12px;border-radius:20px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.88rem}
th,td{padding:11px 14px;text-align:right;white-space:nowrap}
th{color:var(--faint);font-weight:500;font-size:.75rem;border-bottom:1px solid var(--border)}
th:first-child,td:first-child,th:nth-child(2),td:nth-child(2){text-align:left}
tbody tr{border-bottom:1px solid var(--border);transition:background .15s}
tbody tr:last-child{border-bottom:0}
tbody tr.game-hr td:first-child{box-shadow:inset 2px 0 0 var(--wind)}
tbody tr:not(.game-hr){color:var(--mute)}
tbody tr.sel{background:var(--surface-2)}
td.t{font-weight:600}
.nwstext{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:20px 22px}
.nwstext p{max-width:72ch;margin:0 0 12px;color:var(--mute)}
.nwstext p:last-child{margin:0}
.nwstext b{color:var(--text);font-weight:600}
.fine{color:var(--faint);font-size:.76rem;margin:48px 0 56px;max-width:80ch}
.maplibregl-ctrl-attrib{font-size:10px}
.maplibregl-ctrl-group{background:var(--glass)!important;border:1px solid var(--border-2);border-radius:12px!important;box-shadow:none!important;backdrop-filter:blur(12px)}
.maplibregl-ctrl-group button+button{border-top:1px solid var(--border)!important}
.alm-card{position:relative;border-radius:24px;padding:26px 28px;border:1px solid var(--border);overflow:hidden;
  background:linear-gradient(140deg,#FFF6EA,#FFFFFF 48%,#F1F8FE);box-shadow:var(--shadow)}
.alm-head{display:flex;justify-content:space-between;align-items:flex-start;gap:18px 32px;flex-wrap:wrap}
.alm-kicker{display:block;font-size:.8rem;color:var(--temp);font-weight:500}
.alm-head h3{font-weight:600;font-size:clamp(1.4rem,3vw,1.9rem);letter-spacing:-.03em;margin:2px 0 2px}
.alm-where{color:var(--mute);font-size:.9rem}
.alm-score{display:flex;flex-direction:column;gap:8px;min-width:190px}
.alm-team{display:flex;align-items:center;gap:10px;color:var(--mute)}
.alm-team img{width:26px;height:26px;object-fit:contain}
.alm-team span{flex:1}
.alm-team b{font-weight:500;font-size:1.35rem;letter-spacing:-.02em}
.alm-team.win{color:var(--text)} .alm-team.win b{font-weight:700}
.alm-body{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:18px 36px;margin-top:24px;align-items:center}
.alm-hero{display:flex;align-items:center;gap:18px}
.alm-big{font-weight:200;font-size:clamp(3.8rem,7vw,5rem);line-height:.9;letter-spacing:-.06em}
.alm-hero b{display:block;font-weight:600;font-size:1.1rem}
.alm-hero span{color:var(--mute);font-size:.88rem}
.alm-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 18px;margin:0}
.alm-stats dt{color:var(--faint);font-size:.74rem}
.alm-stats dd{margin:0;font-weight:500}
.alm-spark{grid-column:1/-1;border-top:1px solid var(--border);padding-top:14px;min-width:0}
.alm-spark svg{display:block;width:100%;height:auto;overflow:visible}
.alm-note{grid-column:1/-1;margin:0;color:var(--mute);font-size:.85rem}
.alm-compare{grid-column:1/-1;margin:0;padding:12px 16px;border-radius:14px;background:rgba(10,124,196,.06);border:1px solid rgba(10,124,196,.2);font-size:.92rem}
.alm-more{margin-top:12px;background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.alm-more h4{margin:0;padding:12px 18px;font-weight:500;font-size:.82rem;color:var(--mute);border-bottom:1px solid var(--border)}
.alm-row{display:grid;grid-template-columns:130px minmax(0,1fr) minmax(0,1.3fr);gap:12px;padding:12px 18px;border-bottom:1px solid var(--border);font-size:.9rem}
.alm-row:last-child{border-bottom:0}
.alm-rdate{color:var(--mute)} .alm-rwx{color:var(--text);text-align:right}
.alm-empty{color:var(--mute);background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin:0;box-shadow:var(--shadow)}
.alm-loading{color:var(--mute);background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:26px 28px;margin:0;box-shadow:var(--shadow)}
@media (max-width:760px){
  .alm-card{padding:20px}
  .alm-body{grid-template-columns:1fr}
  .alm-stats{grid-template-columns:1fr 1fr}
  .alm-row{grid-template-columns:1fr}
  .alm-rwx{text-align:left}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="wrap">
  <main id="list-view">
    <header class="top">
      <div class="brand">
        <h1>Gameday Sky</h1>
        <p>Pick a game. Get the National Weather Service forecast for that stadium, hour by hour, with the wind drawn over the field.</p>
      </div>
      <div class="controls">
        <div class="chips" role="group" aria-label="Leagues" id="chips"></div>
        <input class="search" id="search" type="search" placeholder="Filter by team or stadium" aria-label="Filter games by team or stadium">
      </div>
      <nav class="days" id="days" aria-label="Choose a date"></nav>
    </header>
    <p class="note" id="listnote">Times shown in your time zone.</p>
    <div id="list"></div>
  </main>
  <main id="detail-view" hidden>
    <button class="back" id="back">&larr; All games</button>
    <div id="detail"></div>
  </main>
</div>

<script>
"use strict";
/* ================= config ================= */
const LEAGUES = {
  mlb:{label:'MLB', path:'baseball/mlb', kind:'baseball'},

async function getJSON(url,{tries=2,timeout=15000}={}){
  let err;
  for(let i=0;i<tries;i++){
    const ac=new AbortController(); const tm=setTimeout(()=>ac.abort(),timeout);
    try{
      const r=await fetch(url,{signal:ac.signal}); clearTimeout(tm);
      if(r.ok) return await r.json();
      err=new Error(`${r.status} from ${new URL(url).hostname}`); err.status=r.status;
      if(r.status<500) break;
    }catch(e){clearTimeout(tm); err=e.name==='AbortError'?new Error(`${new URL(url).hostname} took too long to answer`):e;}
    if(i<tries-1) await sleep(700*(i+1));
  }
  throw err;
}

/* geodesy */
function dest(lat,lon,brg,dist){
  const R=6371008.8, d=dist/R, b=brg*Math.PI/180, p1=lat*Math.PI/180, l1=lon*Math.PI/180;
  const p2=Math.asin(Math.sin(p1)*Math.cos(d)+Math.cos(p1)*Math.sin(d)*Math.cos(b));
  const l2=l1+Math.atan2(Math.sin(b)*Math.sin(d)*Math.cos(p1),Math.cos(d)-Math.sin(p1)*Math.sin(p2));
  return [p2*180/Math.PI,l2*180/Math.PI];
}
function localFrame(lat,lon){
  const k=Math.cos(lat*Math.PI/180);
  return {
    toXY:(la,lo)=>[(lo-lon)*111320*k,(la-lat)*110540],
    toLngLat:(x,y)=>[lon+x/(111320*k),lat+y/110540],
  };
}

function parseEvent(ev,league){

    tv:(c.broadcasts||[]).flatMap(b=>b.names||[]).join(', ')};

async function loadScoreboard(league,date){

const sameCity=(a,b)=>{const n=s=>String(s||'').toLowerCase().replace(/[^a-z]/g,''); a=n(a); b=n(b); return !a||!b||a.includes(b)||b.includes(a);};
async function resolveVenue(g){
  const L=LEAGUES[g.league];
  const table=L.kind==='baseball'?MLB:g.league==='nfl'?NFL:null;
  let base=table&&table[g.home.abbr];

  if(base) return {...base, source:'table'};
  const key='geo:'+(g.venue.id||g.venue.name+g.venue.city);
  const cached=store.get(key); if(cached) return cached;
  const place=[g.venue.city,g.venue.state].filter(Boolean).join(', ');
  const tries=[[g.venue.name,place].filter(Boolean).join(', '), g.venue.name&&`${g.venue.name} stadium ${g.venue.state||''}`, place].filter(Boolean);
  for(const q of tries){
    try{
      const r=await getJSON('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q='+encodeURIComponent(q),{tries:1,timeout:9000});

        store.set(key,out); return out;

  }

function polyArea(p){let a=0;for(let i=0;i<p.length;i++){const[j,k]=[p[i],p[(i+1)%p.length]];a+=j[0]*k[1]-k[0]*j[1];}return a/2;}
function polyCentroid(p){
  let a=0,cx=0,cy=0;
  for(let i=0;i<p.length;i++){const[x0,y0]=p[i],[x1,y1]=p[(i+1)%p.length];const f=x0*y1-x1*y0;a+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f;}
  if(Math.abs(a)<1e-6) return p.reduce((s,q)=>[s[0]+q[0]/p.length,s[1]+q[1]/p.length],[0,0]);
  return [cx/(3*a),cy/(3*a)];
}
/* find home plate on a fan-shaped baseball field outline */
function fanHome(pts){
  const cen=polyCentroid(pts);
  const spans=pts.map((p,i)=>{
    const ang=[];
    pts.forEach((q,j)=>{if(j!==i&&Math.hypot(q[0]-p[0],q[1]-p[1])>1) ang.push(Math.atan2(q[1]-p[1],q[0]-p[0]));});
    ang.sort((a,b)=>a-b);
    let gap=0,gi=0;
    for(let k=0;k<ang.length;k++){const g=k<ang.length-1?ang[k+1]-ang[k]:ang[0]+2*Math.PI-ang[k]; if(g>gap){gap=g;gi=k;}}
    return {i,span:(2*Math.PI-gap)*180/Math.PI};
  });
  const corners=spans.filter(s=>s.span<125);
  const clusters=[];
  for(const c of corners){
    const p=pts[c.i]; let cl=clusters.find(k=>Math.hypot(k.p[0]-p[0],k.p[1]-p[1])<25);
    if(!cl) clusters.push({p,best:c}); else if(c.span<cl.best.span){cl.best=c;cl.p=p;}
  }
  const bearingTo=(a,b)=>norm360(90-Math.atan2(b[1]-a[1],b[0]-a[0])*180/Math.PI);
  if(clusters.length===3){
    let best=null,score=Infinity;
    clusters.forEach((c,i)=>{
      const o=clusters.filter((_,j)=>j!==i);
      const d1=Math.hypot(o[0].p[0]-c.p[0],o[0].p[1]-c.p[1]), d2=Math.hypot(o[1].p[0]-c.p[0],o[1].p[1]-c.p[1]);
      const s=Math.abs(d1-d2)/Math.max(d1,d2); if(s<score){score=s;best={c,o};}
    });
    if(score>0.2) return null;
    const m=[(best.o[0].p[0]+best.o[1].p[0])/2,(best.o[0].p[1]+best.o[1].p[1])/2];
    return {home:best.c.p, bearing:bearingTo(best.c.p,m)};
  }
  if(clusters.length===2){
    const [a,b]=clusters.map(c=>c.p);
    const m=[(a[0]+b[0])/2,(a[1]+b[1])/2];
    let n=[-(b[1]-a[1]),b[0]-a[0]]; const L=Math.hypot(...n); n=[n[0]/L,n[1]/L];
    if((m[0]-cen[0])*n[0]+(m[1]-cen[1])*n[1]<0) n=[-n[0],-n[1]];
    const home=pts.reduce((best,p)=>((p[0]-m[0])*n[0]+(p[1]-m[1])*n[1])<((best[0]-m[0])*n[0]+(best[1]-m[1])*n[1])?p:best);
    return {home, bearing:norm360(90-Math.atan2(n[1],n[0])*180/Math.PI)};
  }
  return null;
}

  const j=await getJSON('https://overpass-api.de/api/interpreter?data='+encodeURIComponent(q),{tries:1,timeout:10000});

  const cands=(j.elements||[]).filter(e=>e.geometry&&e.geometry.length>3).map(e=>{

/* ================= NWS ================= */
function isoDur(d){const m=String(d).match(/P(?:(\d+)D)?(?:T(?:(\d+)H)?(?:(\d+)M)?)?/)||[];return(((+m[1]||0)*24+(+m[2]||0))*60+(+m[3]||0))*60e3;}
function gridSeries(prop){
  const vals=(prop?.values||[]).map(v=>{const[s,d]=v.validTime.split('/');const st=Date.parse(s);return{st,en:st+isoDur(d),v:v.value};});
  const u=prop?.uom||'';
  return t=>{const x=vals.find(o=>t>=o.st&&t<o.en);return x&&x.v!=null?{v:x.v,u}:null;};
}
const toMph=o=>o==null?null:(/km_h/.test(o.u)?o.v*0.621371:/m_s/.test(o.u)?o.v*2.23694:o.v);
const toF=o=>o==null?null:(/degC/.test(o.u)?c2f(o.v):o.v);
function parseWind(s){const n=String(s||'').match(/\d+/g);return n?Math.max(...n.map(Number)):null;}
async function loadNWS(lat,lon){
  const pt=`${lat.toFixed(4)},${lon.toFixed(4)}`;
  let p;
  try{p=await getJSON(`https://api.weather.gov/points/${pt}`);}
  catch(e){ if(e.status===404) {const x=new Error('outside'); x.outside=true; throw x;} throw e; }
  const pr=p.properties;
  const [hr,grid,fc,al]=await Promise.allSettled([
    getJSON(pr.forecastHourly,{tries:3}), getJSON(pr.forecastGridData,{tries:2}),
    getJSON(pr.forecast,{tries:2}), getJSON(`https://api.weather.gov/alerts/active?point=${pt}`,{tries:1})]);
  const g=grid.status==='fulfilled'?grid.value.properties:{};
  const S={gust:gridSeries(g.windGust),feels:gridSeries(g.apparentTemperature),sky:gridSeries(g.skyCover),
    qpf:gridSeries(g.quantitativePrecipitation),dir:gridSeries(g.windDirection),spd:gridSeries(g.windSpeed)};
  const hours=hr.status==='fulfilled'?(hr.value.properties.periods||[]).map(p=>{
    const t=Date.parse(p.startTime);
    const dew=p.dewpoint?(/degC/.test(p.dewpoint.unitCode)?c2f(p.dewpoint.value):p.dewpoint.value):null;
    const dirG=S.dir(t);
    return {t, temp:p.temperatureUnit==='C'?c2f(p.temperature):p.temperature, pop:p.probabilityOfPrecipitation?.value??0,
      rh:p.relativeHumidity?.value??null, dew, mph:parseWind(p.windSpeed), card:p.windDirection,
      dir:dirG?dirG.v:card2deg(p.windDirection), gust:toMph(S.gust(t)), feels:toF(S.feels(t)), sky:S.sky(t)?.v??null,
      qpf:null, short:p.shortForecast, day:p.isDaytime};
  }):[];
  // spread grid precip totals evenly across their intervals
  if(g.quantitativePrecipitation){
    for(const h of hours){
      const v=(g.quantitativePrecipitation.values||[]).find(o=>{const[s,d]=o.validTime.split('/');const st=Date.parse(s);return h.t>=st&&h.t<st+isoDur(d);});
      if(v){const[,d]=v.validTime.split('/');h.qpf=(v.value||0)/25.4/Math.max(1,isoDur(d)/HOUR);}
    }
  }
  return {tz:pr.timeZone, place:pr.relativeLocation?.properties, hours,
    hourlyErr:hr.status==='rejected'?hr.reason:null,
    updated:hr.status==='fulfilled'?hr.value.properties.updateTime:null,
    periods:fc.status==='fulfilled'?fc.value.properties.periods||[]:[],
    alerts:al.status==='fulfilled'?(al.value.features||[]).map(f=>f.properties):[]};
}

/* ================= wind language ================= */
function relWind(kind,field,dirFrom,mph){
  if(mph==null||dirFrom==null) return '';
  if(mph<3) return 'Light and variable. Little effect on play.';
  const to=norm360(dirFrom+180);
  if(kind==='baseball'){
    const d=norm180(to-field), a=Math.abs(d);
    let s;
    if(a<=22.5) s='Blowing out to center field';
    else if(a<=67.5) s=d>0?'Blowing out to right field':'Blowing out to left field';
    else if(a<=112.5) s=d>0?'Blowing across the field, left to right':'Blowing across the field, right to left';
    else if(a<=157.5) s=d>0?'Blowing in from left field':'Blowing in from right field';
    else s='Blowing straight in from center field';
    const effect=a<=67.5?(mph>=10?' Fly balls will carry.':''):a>=112.5?(mph>=10?' Expect it to knock down fly balls.':''):'';
    return s+'.'+effect;
  }
  const d=norm180(to-field), a=Math.abs(d);
  const endTo=deg2word(a<=90?field:field+180);
  if(a<=30||a>=150) return `Blowing end to end, toward the ${endTo} end zone.${mph>=12?' Kickers going that way get help.':''}`;
  if(a>=60&&a<=120) return `Crosswind, blowing sideline to sideline.${mph>=12?' Tough on field goals and deep passes.':''}`;
  return `Quartering wind, angled toward the ${endTo} end zone.`;
}

/* ================= wind particles ================= */
class WindLayer{
  constructor(map,center){
    this.map=map; this.center=center; this.F=localFrame(center[0],center[1]);
    this.cv=document.createElement('canvas'); this.cv.className='windcanvas';
    map.getCanvasContainer().appendChild(this.cv); this.ctx=this.cv.getContext('2d');
    this.radius=300; this.parts=Array.from({length:innerWidth<640?240:420},()=>this.spawn({})); this.dir=0; this.mph=0;
    this.resize(); map.on('resize',()=>this.resize());
    if(reduceMotion) map.on('render',()=>this.draw(true));
  }
  resize(){const c=this.map.getContainer(),r=devicePixelRatio||1;this.cv.width=c.clientWidth*r;this.cv.height=c.clientHeight*r;this.cv.style.width=c.clientWidth+'px';this.cv.style.height=c.clientHeight+'px';this.draw(reduceMotion);}
  spawn(p){const r=this.radius*Math.sqrt(Math.random()),a=Math.random()*2*Math.PI;p.x=r*Math.cos(a);p.y=r*Math.sin(a);p.trail=[];p.age=0;p.life=70+Math.random()*90;return p;}
  set(dirFrom,mph){
    this.dir=dirFrom==null?0:norm360(dirFrom+180); this.mph=mph||0;
    if(reduceMotion){this.parts.forEach(p=>this.spawn(p));for(let i=0;i<22;i++)this.step();this.draw(true);}
  }
  step(){
    const sp=0.25+this.mph*0.13, r=this.dir*Math.PI/180, dx=Math.sin(r)*sp, dy=Math.cos(r)*sp, calm=this.mph<3;
    for(const p of this.parts){
      p.x+=dx+(calm?(Math.random()-.5)*.6:(Math.random()-.5)*sp*.15); p.y+=dy+(calm?(Math.random()-.5)*.6:(Math.random()-.5)*sp*.15);
      p.trail.push([p.x,p.y]); if(p.trail.length>18) p.trail.shift();
      if(++p.age>p.life||Math.hypot(p.x,p.y)>this.radius) this.spawn(p);
    }
  }
  color(){const m=this.mph;return m<5?'232,238,247':m<12?'92,200,255':m<20?'255,181,71':'255,93,108';}
  draw(heads){
    const ctx=this.ctx,r=devicePixelRatio||1; ctx.setTransform(r,0,0,r,0,0);
    ctx.clearRect(0,0,this.cv.width,this.cv.height);
    ctx.lineCap='round'; ctx.lineJoin='round'; const col=this.color();
    const lines=[];
    for(const p of this.parts){
      if(p.trail.length<2) continue;
      lines.push({fade:Math.min(1,p.age/15,(p.life-p.age)/15),pts:p.trail.map(([x,y])=>this.map.project(this.F.toLngLat(x,y))),p});
    }
    const trace=pts=>{ctx.beginPath();pts.forEach((s,i)=>i?ctx.lineTo(s.x,s.y):ctx.moveTo(s.x,s.y));};
    ctx.lineWidth=4;
    for(const l of lines){ctx.strokeStyle=`rgba(8,14,26,${0.45*l.fade})`;trace(l.pts);ctx.stroke();}
    ctx.lineWidth=2;
    for(const l of lines){
      const p=l.p;
      ctx.strokeStyle=`rgba(${col},${0.95*l.fade})`; trace(l.pts); ctx.stroke();
      if(heads){
        const a=l.pts[l.pts.length-2], b=l.pts[l.pts.length-1];
        const ang=Math.atan2(b.y-a.y,b.x-a.x); ctx.beginPath();
        ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-6*Math.cos(ang-.5),b.y-6*Math.sin(ang-.5));
        ctx.moveTo(b.x,b.y); ctx.lineTo(b.x-6*Math.cos(ang+.5),b.y-6*Math.sin(ang+.5)); ctx.stroke();
      }
    }
  }
  start(){ if(reduceMotion) return; this.running=true; const loop=()=>{ if(!this.running) return; if(!document.hidden){this.step();this.draw(false);} this.raf=requestAnimationFrame(loop);}; loop(); }
  stop(){this.running=false;cancelAnimationFrame(this.raf);this.cv.remove();}
}

  function drawChart(avail){

    const tMin=hs[0].t,tMax=hs[hs.length-1].t, x=t=>pl+(t-tMin)/(tMax-tMin)*(W-pl-pr);

    const bw=(W-pl-pr)/hs.length*0.6;

    const path=k=>hs.filter(h=>h[k]!=null).map((h,i)=>`${i?'L':'M'}${x(h.t).toFixed(1)},${y(h[k]).toFixed(1)}`).join('');
    const gx0=x(Math.max(tMin,anchorT)), gx1=x(Math.min(tMax,anchorT+dur));
    const labels=hs.map((h,i)=>i%lblEvery?'':`<text x="${x(h.t)}" y="${plotB+18}" text-anchor="middle" fill="#6B7485" font-size="12">${fHour(h.t,tz)}</text>`).join('');
    const winds=hs.map((h,i)=>h.dir==null||i%wEvery?'':`<g transform="translate(${x(h.t)},${plotB+48})"><g transform="rotate(${norm360(h.dir+180)})"><path d="M0,-9 L5,3 L0,0 L-5,3 Z" fill="#0A7CC4"/></g></g>
      <text x="${x(h.t)}" y="${plotB+74}" text-anchor="middle" fill="#121826" font-size="11">${h.mph}</text>`).join('');
    const pts=hs.filter((h,i)=>i%tEvery===0).map(h=>`<text x="${x(h.t)}" y="${y(h.temp)-9}" text-anchor="middle" fill="#D98200" font-size="12" font-weight="700">${rnd(h.temp)}°</text>`).join('');
    $('#chart').innerHTML=`<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Temperature, feels-like temperature, rain chance and wind by hour">
      <rect x="${gx0}" y="${pt}" width="${Math.max(0,gx1-gx0)}" height="${plotB-pt}" fill="#0A7CC4" opacity=".06" rx="8"/>
      <text x="${gx0+6}" y="${pt+14}" fill="#0A7CC4" font-size="12" font-weight="500">${over?'Now':'Game time'}</text>
      ${grid}${bars}
      <path d="${path('feels')}" fill="none" stroke="#DC3F44" stroke-width="2" stroke-dasharray="5 5"/>
      <path d="${path('temp')}" fill="none" stroke="#D98200" stroke-width="3" stroke-linejoin="round"/>
      ${pts}${labels}
      <text x="${pl-8}" y="${plotB+52}" text-anchor="end" fill="#6B7485" font-size="11">wind</text>
      <text x="${pl-8}" y="${plotB+74}" text-anchor="end" fill="#6B7485" font-size="11">mph</text>${winds}
    </svg><div class="legend"><span><i style="background:#D98200"></i>Temperature</span><span><i style="background:repeating-linear-gradient(90deg,#DC3F44 0 5px,transparent 5px 9px)"></i>Feels like</span><span><i style="background:#6D7BF0;height:10px;width:10px;opacity:.7"></i>Rain chance</span><span>Arrows point where the wind is blowing</span></div>`;
  }
  function renderTable(){
    const rows=hours.map((h,i)=>({h,i})).filter(({h})=>h.t>=floorHour(anchorT)-3*HOUR&&h.t<=anchorT+dur+2*HOUR);
    $('#htable').innerHTML=`<thead><tr><th>Time</th><th>Sky</th><th>Temp</th><th>Feels</th><th>Wind</th><th>Gusts</th><th>Humidity</th><th>Dew pt</th><th>Rain chance</th><th>Rain</th></tr></thead><tbody>${
      rows.map(({h,i})=>`<tr data-i="${i}" class="${h.t>=floorHour(anchorT)&&h.t<=anchorT+dur?'game-hr':''}">
        <td class="t">${fHour(h.t,tz)}</td><td>${esc(h.short||'')}</td><td class="t">${rnd(h.temp)}°</td><td>${h.feels!=null?rnd(h.feels)+'°':'–'}</td>
        <td>${h.mph??'–'} ${esc(h.card||'')}</td><td>${h.gust!=null?rnd(h.gust):'–'}</td><td>${h.rh!=null?h.rh+'%':'–'}</td>
        <td>${h.dew!=null?rnd(h.dew)+'°':'–'}</td><td>${h.pop??0}%</td><td>${h.qpf!=null?(h.qpf<0.005?'0':h.qpf.toFixed(2))+' in':'–'}</td></tr>`).join('')}</tbody>`;
    $('#htable tbody').addEventListener('click',e=>{const r=e.target.closest('tr');if(r&&$(`#scrub [data-i="${r.dataset.i}"]`))updateHour(+r.dataset.i);});
  }
  function renderPeriods(){
    const ps=wx.periods; let i=ps.findIndex(p=>anchorT<Date.parse(p.endTime)); if(i<0)i=0;
    $('#nwstext').innerHTML=ps.slice(Math.max(0,i),i+3).map(p=>`<p><b>${esc(p.name)}.</b> ${esc(p.detailedForecast)}</p>`).join('');
  }
}

/* ================= almanac: last meetings + historical weather ================= */
const WMO={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Freezing fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',
  56:'Freezing drizzle',57:'Freezing drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',66:'Freezing rain',67:'Freezing rain',71:'Light snow',73:'Snow',
  75:'Heavy snow',77:'Snow grains',80:'Rain showers',81:'Rain showers',82:'Heavy showers',85:'Snow showers',86:'Heavy snow showers',95:'Thunderstorms',96:'Thunderstorms with hail',99:'Thunderstorms with hail'};
const schedMem=new Map();
function parseSched(ev){
  const c=ev.competitions?.[0]||{}; const st=c.status?.type||ev.status?.type||{};
  const cs=(c.competitors||[]).map(x=>({id:String(x.id||x.team?.id||''),homeAway:x.homeAway,abbr:x.team?.abbreviation||'',
    name:x.team?.displayName||'',short:x.team?.shortDisplayName||x.team?.location||x.team?.abbreviation||'',
    logo:x.team?.logos?.[0]?.href||x.team?.logo||'',
    score:x.score==null?'':typeof x.score==='object'?(x.score.displayValue??x.score.value??''):String(x.score),winner:!!x.winner}));
  const v=c.venue||{};
  return {id:String(ev.id),date:c.date||ev.date,done:!!st.completed,home:cs.find(x=>x.homeAway==='home')||cs[0],away:cs.find(x=>x.homeAway==='away')||cs[1],
    venue:{id:v.id,name:v.fullName||'',city:v.address?.city||'',state:v.address?.state||'',indoor:!!v.indoor},neutral:!!c.neutralSite};
}
async function teamSeason(league,teamId,year,type){
  const key=`sched:${league}:${teamId}:${year}:${type||''}`;
  const past=year<new Date().getFullYear()-(LEAGUES[league].kind==='baseball'?0:1);
  if(schedMem.has(key)) return schedMem.get(key);
  if(past){const c=store.get(key); if(c){schedMem.set(key,c); return c;}}
  const L=LEAGUES[league];
  const j=await getJSON(`${ESPN}${L.path}/teams/${teamId}/schedule?season=${year}${type?`&seasontype=${type}`:''}`,{tries:1,timeout:12000});
  const out=(j.events||[]).map(parseSched).filter(m=>m.done&&m.home&&m.away);
  schedMem.set(key,out); if(past) store.set(key,out);
  return out;
}
async function findMeetings(g){
  const L=LEAGUES[g.league], a=g.home.id, b=g.away.id;
  if(!a||!b) return {list:[],span:0};
  const t0=Date.parse(g.date), d=new Date(t0);
  const season=L.kind==='baseball'?d.getFullYear():(d.getMonth()<2?d.getFullYear()-1:d.getFullYear());
  const span=g.league==='mlb'?3:g.league==='nfl'?10:16;
  const types=L.kind==='football'?[2,3]:[null];
  const seen=new Set(), list=[];
  for(let s=0;s<span&&list.length<3;s+=4){
    const yrs=Array.from({length:Math.min(4,span-s)},(_,i)=>season-s-i);
    const res=await Promise.allSettled(yrs.flatMap(y=>types.map(t=>teamSeason(g.league,a,y,t))));
    for(const r of res){ if(r.status!=='fulfilled') continue;
      for(const m of r.value){
        const ids=[m.home.id,m.away.id];
        if(ids.includes(String(a))&&ids.includes(String(b))&&m.id!==g.id&&Date.parse(m.date)<t0-HOUR&&!seen.has(m.id)){seen.add(m.id);list.push(m);}
      }}
  }
  list.sort((x,y)=>Date.parse(y.date)-Date.parse(x.date));
  return {list:list.slice(0,3),span};
}
async function pastWeather(lat,lon,t,dur){
  const day=ms=>new Date(ms).toISOString().slice(0,10);
  const recent=Date.now()-t<60*86400e3;
  const base=recent?'https://api.open-meteo.com/v1/forecast':'https://archive-api.open-meteo.com/v1/archive';
  const vars='temperature_2m,apparent_temperature,relative_humidity_2m,dew_point_2m,precipitation,weather_code,cloud_cover,wind_speed_10m,wind_direction_10m,wind_gusts_10m';
  const j=await getJSON(`${base}?latitude=${lat.toFixed(4)}&longitude=${lon.toFixed(4)}&start_date=${day(t-86400e3)}&end_date=${day(t+86400e3)}&hourly=${vars}&temperature_unit=fahrenheit&wind_speed_unit=mph&precipitation_unit=inch&timezone=auto`,{tries:2,timeout:15000});
  const H=j.hourly||{}, off=(j.utc_offset_seconds||0)*1000;
  const rows=(H.time||[]).map((s,i)=>({t:Date.parse(s+'Z')-off,temp:H.temperature_2m[i],feels:H.apparent_temperature[i],rh:H.relative_humidity_2m[i],dew:H.dew_point_2m[i],
    precip:H.precipitation[i],code:H.weather_code[i],sky:H.cloud_cover[i],mph:H.wind_speed_10m[i],dir:H.wind_direction_10m[i],gust:H.wind_gusts_10m[i]}));
  const win=rows.filter(r=>r.t>=floorHour(t)&&r.t<=t+dur&&r.temp!=null);
  if(!win.length) return null;
  return {tz:j.timezone,win,kick:win[0],precip:win.reduce((s,r)=>s+(r.precip||0),0),
    hi:Math.max(...win.map(r=>r.temp)),lo:Math.min(...win.map(r=>r.temp)),
    maxGust:Math.max(...win.map(r=>r.gust||0)),
    worst:win.reduce((a,r)=>(r.code??0)>(a.code??0)?r:a,win[0])};
}
function almSpark(w,tz,W=640){
  W=Math.max(260,Math.round(W));
  const H=140,pl=22,pr=22,pt=24,pb=36, n=w.win.length;
  const gap=(W-pl-pr)/Math.max(1,n-1), every=gap<34?2:1;
  const lo=Math.floor(w.lo-4), hi=Math.ceil(w.hi+4);
  const x=i=>pl+(n===1?0.5:i/(n-1))*(W-pl-pr), y=v=>pt+(hi-v)/(hi-lo||1)*(H-pt-pb);
  const line=w.win.map((r,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(r.temp).toFixed(1)}`).join('');
  const area=`${line}L${x(n-1)},${H-pb}L${x(0)},${H-pb}Z`;
  const dots=w.win.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r.temp)}" r="3" fill="#D98200"/>
    <text x="${x(i)}" y="${y(r.temp)-9}" text-anchor="middle" fill="#121826" font-size="12" font-weight="500">${rnd(r.temp)}°</text>
    ${i%every?'':`<text x="${x(i)}" y="${H-8}" text-anchor="middle" fill="#8A93A3" font-size="11">${fHour(r.t,tz)}</text>`}
    <g transform="translate(${x(i)},${H-26})"><g transform="rotate(${norm360(r.dir+180)})"><path d="M0,-6 L3.5,2.5 L0,0.5 L-3.5,2.5 Z" fill="#0A7CC4"/></g></g>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Temperature and wind through that game">
    <defs><linearGradient id="almg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#D98200" stop-opacity=".28"/><stop offset="1" stop-color="#D98200" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#almg)"/><path d="${line}" fill="none" stroke="#D98200" stroke-width="2"/>${dots}</svg>`;
}
async function loadAlmanac(g,kind,now,token){
  const box=$('#almanac'); if(!box) return;
  const dur=kind==='baseball'?3*HOUR:3.5*HOUR;
  let res;
  try{res=await findMeetings(g);}catch(e){ if(token===state.viewToken) box.innerHTML=`<p class="alm-empty">Couldn't load past schedules from ESPN (${esc(e.message)}).</p>`; return; }
  if(token!==state.viewToken) return;
  if(!res.list.length){box.innerHTML=`<p class="alm-empty">No meetings between these two in the last ${res.span} seasons, so there's no almanac entry yet. This one writes the first page.</p>`;return;}
  const withWx=await Promise.all(res.list.map(async m=>{
    try{
      const v=await resolveVenue({league:g.league,home:{abbr:m.home.abbr},venue:m.venue,neutral:m.neutral});
      const w=await pastWeather(v.lat,v.lon,Date.parse(m.date),dur);
      return {m,v,w};
    }catch{return {m,v:null,w:null};}
  }));
  if(token!==state.viewToken) return;
  const [first,...rest]=withWx;
  const score=m=>{
    const side=s=>`<span class="alm-team ${s.winner?'win':''}">${s.logo?`<img src="${esc(s.logo)}" alt="">`:''}<span>${esc(s.short||s.abbr)}</span><b>${esc(s.score)}</b></span>`;
    return `<div class="alm-score">${side(m.away)}${side(m.home)}</div>`;
  };
  const tzOf=x=>x.w?.tz||Intl.DateTimeFormat().resolvedOptions().timeZone;
  const dateStr=x=>fmt(Date.parse(x.m.date),tzOf(x),{weekday:'short',month:'long',day:'numeric',year:'numeric'});
  const indoor=x=>x.v&&(x.v.roof==='dome'||x.v.roof==='retractable'||x.m.venue.indoor);
  const ago=ms=>{const d=Math.round((Date.now()-ms)/86400e3); return d<60?`${d} days ago`:d<730?`${Math.round(d/30.4)} months ago`:`${Math.round(d/365.25)} years ago`;};
  let feature='';
  const f=first, w=f.w, k=w?.kick;
  let compare='';
  if(k&&now&&now.temp!=null){
    const dT=Math.round(now.temp-k.temp), dW=Math.round((now.mph||0)-(k.mph||0));
    const parts=[Math.abs(dT)<3?'about the same temperature':`${Math.abs(dT)}° ${dT>0?'warmer':'colder'}`];
    if(Math.abs(dW)>=5) parts.push(`${dW>0?'windier':'calmer'} by ${Math.abs(dW)} mph`);
    compare=`<p class="alm-compare">Compared with that day, this game's forecast is ${parts.join(' and ')}.</p>`;
  }
  feature=`<article class="alm-card">
    <header class="alm-head">
      <div><span class="alm-kicker">Last meeting, ${esc(ago(Date.parse(f.m.date)))}</span>
        <h3>${esc(dateStr(f))}</h3>
        <span class="alm-where">${esc(f.m.venue.name)}${f.m.venue.city?`, ${esc(f.m.venue.city)}${f.m.venue.state?`, ${esc(f.m.venue.state)}`:''}`:''}</span></div>
      ${score(f.m)}
    </header>
    ${w?`<div class="alm-body">
      <div class="alm-hero"><div class="alm-big">${rnd(k.temp)}°</div>
        <div><b>${esc(WMO[k.code]||'')}</b><span>at ${kind==='baseball'?'first pitch':'kickoff'}, feels like ${rnd(k.feels)}°</span></div></div>
      <dl class="alm-stats">
        <div><dt>Wind</dt><dd>${rnd(k.mph)} mph ${esc(deg2card(k.dir))}</dd></div>
        <div><dt>Peak gust</dt><dd>${rnd(w.maxGust)} mph</dd></div>
        <div><dt>Humidity</dt><dd>${rnd(k.rh)}%</dd></div>
        <div><dt>Game range</dt><dd>${rnd(w.lo)}° to ${rnd(w.hi)}°</dd></div>
        <div><dt>Precip</dt><dd>${w.precip<0.005?'None':w.precip.toFixed(2)+' in'}</dd></div>
        <div><dt>Worst sky</dt><dd>${esc(WMO[w.worst.code]||'–')}</dd></div>
      </dl>
      <div class="alm-spark" id="almspark"></div>
      ${indoor(f)?`<p class="alm-note">Played at a covered stadium. These are the outdoor conditions that day.</p>`:''}
      ${compare}
    </div>`:`<p class="alm-empty">Couldn't reconstruct the weather for this game.</p>`}
  </article>`;
  const more=rest.length?`<div class="alm-more"><h4>Earlier meetings</h4>${rest.map(x=>`<div class="alm-row">
      <span class="alm-rdate">${esc(fmt(Date.parse(x.m.date),tzOf(x),{month:'short',day:'numeric',year:'numeric'}))}</span>
      <span class="alm-rscore">${esc(x.m.away.abbr)} ${esc(x.m.away.score)}, ${esc(x.m.home.abbr)} ${esc(x.m.home.score)}</span>
      <span class="alm-rwx">${x.w?`${rnd(x.w.kick.temp)}°, ${esc((WMO[x.w.kick.code]||'').toLowerCase())}, wind ${rnd(x.w.kick.mph)} mph`:'Weather unavailable'}</span></div>`).join('')}</div>`:'';
  box.innerHTML=feature+more;
  const sp=$('#almspark');
  if(sp&&w){
    const draw=()=>{const cw=sp.clientWidth; if(cw) sp.innerHTML=almSpark(w,w.tz,cw);};
    draw();
    if(window.ResizeObserver){const ro=new ResizeObserver(draw); ro.observe(sp); if(detail) detail.ro=ro;}
  }
}

/* ================= routing + events ================= */
function route(){
  const m=location.hash.match(/^#\/g\/(mlb|nfl|fbs|fcs)\/([\w-]+)$/);
  if(m) showGame(m[1],m[2]);
  else{ state.viewToken++; teardown(); $('#detail-view').hidden=true; $('#list-view').hidden=false; if(!state.games.length&&!state.loading) loadDay(); else requestAnimationFrame(()=>scrollTo(0,state.listY||0)); }
}
$('#chips').addEventListener('click',e=>{
  const b=e.target.closest('.chip'); if(!b) return; const k=b.dataset.lg;
  state.leagues.has(k)?state.leagues.delete(k):state.leagues.add(k); store.set('leagues',[...state.leagues]); renderChips();
  const date=ymd(dayDate(state.day));
  if(state.leagues.has(k)&&!state.cache.has(k+date)) loadDay(); else renderList();
});
$('#days').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b)return;state.day=+b.dataset.day;renderDays();loadDay();});
$('#search').addEventListener('input',e=>{state.query=e.target.value;renderList();});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)location.hash='#/g/'+b.dataset.go;});
$('#back').addEventListener('click',()=>{ location.hash=''; });
window.addEventListener('hashchange',route);
renderChips(); renderDays(); route();
if(location.hash) loadDay();
</script>
</body>
</html>
